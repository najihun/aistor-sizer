<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIStor Cluster Sizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
  :root{
    --bg:#f4f3f1;--surface:#ffffff;--surface-2:#efedea;--surface-3:#e7e4e0;
    --border:#ded9d3;--border-strong:#ccc5bc;--text:#1c1a18;--muted:#6d6862;--faint:#938d85;
    --accent:#c7264e;--accent-ink:#a11a3d;--accent-weak:rgba(199,38,78,.09);
    --ok:#1a8f63;--ok-weak:rgba(26,143,99,.12);--warn:#b5791a;--warn-weak:rgba(181,121,26,.14);
    --drive:#5a86c9;--drive-parity:#c7264e;--logo-ink:#111322;
    --shadow:0 1px 2px rgba(30,26,22,.05),0 8px 24px -12px rgba(30,26,22,.14);
    --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:'IBM Plex Sans KR','IBM Plex Sans',system-ui,-apple-system,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#17161a;--surface:#211f24;--surface-2:#2a272e;--surface-3:#333039;
      --border:#3a3742;--border-strong:#4a4652;--text:#efecf0;--muted:#a7a1ad;--faint:#7d7885;
      --accent:#ff5c81;--accent-ink:#ff85a0;--accent-weak:rgba(255,92,129,.12);
      --ok:#3ecb95;--ok-weak:rgba(62,203,149,.15);--warn:#e6b45a;--warn-weak:rgba(230,180,90,.16);
      --drive:#6f9bde;--drive-parity:#ff5c81;--logo-ink:#f2f2f5;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#17161a;--surface:#211f24;--surface-2:#2a272e;--surface-3:#333039;
    --border:#3a3742;--border-strong:#4a4652;--text:#efecf0;--muted:#a7a1ad;--faint:#7d7885;
    --accent:#ff5c81;--accent-ink:#ff85a0;--accent-weak:rgba(255,92,129,.12);
    --ok:#3ecb95;--ok-weak:rgba(62,203,149,.15);--warn:#e6b45a;--warn-weak:rgba(230,180,90,.16);
    --drive:#6f9bde;--drive-parity:#ff5c81;--logo-ink:#f2f2f5;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1240px;margin:0 auto;padding:28px 22px 64px}

  header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:22px}
  .brand{display:flex;align-items:center;gap:14px}
  .aistor-logo{height:30px;width:auto;flex:none;fill:var(--logo-ink)}
  .brand-sep{width:1px;align-self:stretch;background:var(--border-strong);margin:2px 0}
  h1{font-size:23px;font-weight:700;margin:0;letter-spacing:-.01em}
  .hgroup{display:flex;flex-direction:column;align-items:flex-end;gap:9px}
  .sub{color:var(--muted);font-size:13.5px;max-width:520px;text-align:right}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:500}
  .langtog{display:inline-flex;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:8px;padding:3px;gap:3px}
  .langtog button{font-family:var(--mono);font-size:11.5px;font-weight:600;padding:5px 11px;border:0;background:transparent;color:var(--muted);border-radius:5px;cursor:pointer;transition:.12s}
  .langtog button.active{background:var(--accent);color:#fff}

  .howto{display:flex;align-items:center;flex-wrap:wrap;gap:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 18px;margin-bottom:22px;box-shadow:var(--shadow);font-size:13px;color:var(--muted)}
  .howto .step{display:inline-flex;align-items:center;gap:7px}
  .howto .step b{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:700;flex:none}
  .howto .arw{color:var(--faint);font-weight:600}

  .app{display:grid;grid-template-columns:340px 1fr;gap:22px;align-items:start}
  @media (max-width:900px){.app{grid-template-columns:1fr}}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
  aside.panel{padding:20px;position:sticky;top:18px}
  @media (max-width:900px){aside.panel{position:static}}

  .field{margin-bottom:20px}
  .field:last-child{margin-bottom:0}
  .label{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--muted);text-transform:uppercase;margin-bottom:9px;gap:8px}
  .label .hint{font-weight:400;text-transform:none;letter-spacing:0;color:var(--faint);font-size:11.5px;text-align:right}

  .presets{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .presets button{font-family:var(--mono);font-size:13px;font-weight:500;padding:10px 4px;border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text);border-radius:9px;cursor:pointer;transition:.12s}
  .presets button:hover{border-color:var(--accent);color:var(--accent)}
  .presets button.active{background:var(--accent);border-color:var(--accent);color:#fff}

  .row{display:flex;gap:8px}
  .nicrow{display:flex;align-items:center;gap:8px}
  .niclbl{flex:0 0 96px;font-size:11.5px;color:var(--muted);font-weight:500}
  .nicrow select{flex:1;min-width:0}
  .custom{display:flex;gap:8px;margin-top:8px}
  input[type=number],select{font-family:var(--mono);font-size:13.5px;width:100%;padding:9px 10px;background:var(--surface-2);color:var(--text);border:1px solid var(--border-strong);border-radius:9px}
  input[type=number]:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}

  .seg{display:flex;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:9px;padding:3px;gap:3px}
  .seg button{flex:1;font-family:var(--sans);font-size:12.5px;font-weight:500;padding:8px 6px;border:0;background:transparent;color:var(--muted);border-radius:6px;cursor:pointer;transition:.12s}
  .seg button.active{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:600}
  .seg.mini button{font-family:var(--mono);font-size:12px;padding:7px 4px}
  .ecfixed{font-family:var(--mono);font-size:13.5px;font-weight:600;padding:9px 12px;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:9px;color:var(--text)}

  .sliderbox{opacity:.4;pointer-events:none;transition:.15s}
  .sliderbox.on{opacity:1;pointer-events:auto}
  .slider-head{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--muted);margin-bottom:6px}
  .slider-head b{font-family:var(--mono);font-size:15px;color:var(--text);font-weight:600}
  input[type=range]{width:100%;accent-color:var(--accent);cursor:pointer}
  .chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
  .chk input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}

  .results{display:flex;flex-direction:column;gap:16px;min-width:0}
  .headline{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px 22px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
  .headline .big{font-family:var(--mono);font-size:40px;font-weight:600;line-height:1;letter-spacing:-.02em}
  .headline .big span{font-size:20px;color:var(--muted);font-weight:500}
  .hl-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;font-weight:600}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:6px 12px;border-radius:20px;font-family:var(--mono)}
  .badge.ok{background:var(--ok-weak);color:var(--ok)}
  .badge.warn{background:var(--warn-weak);color:var(--warn)}
  .badge .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
  .hl-target{text-align:right}
  .hl-target .t{font-family:var(--mono);font-size:15px;font-weight:500}

  .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  @media (max-width:1080px){.metrics{grid-template-columns:repeat(2,1fr)}}
  .metric{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:15px 16px;box-shadow:var(--shadow)}
  .metric .k{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;font-weight:600}
  .metric .v{font-family:var(--mono);font-size:26px;font-weight:600;margin-top:7px;letter-spacing:-.01em}
  .metric .v small{font-size:14px;color:var(--muted);font-weight:500}
  .metric .note{font-size:11.5px;color:var(--faint);margin-top:3px}

  .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media (max-width:760px){.cols{grid-template-columns:1fr}}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow)}
  .card h3{font-size:13px;margin:0 0 14px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
  .card h3 .ic{color:var(--accent)}

  .spec{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-bottom:1px dashed var(--border);gap:12px}
  .spec:last-child{border-bottom:0;padding-bottom:0}
  .spec .sk{font-size:13px;color:var(--muted);flex:none}
  .spec .sv{font-family:var(--mono);font-size:13.5px;font-weight:500;text-align:right}
  .spec .sv em{font-style:normal;color:var(--faint);font-size:11.5px}

  .tolgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tol{background:var(--surface-2);border-radius:10px;padding:14px;text-align:center}
  .tol .tv{font-family:var(--mono);font-size:30px;font-weight:600;color:var(--ok)}
  .tol .tk{font-size:11.5px;color:var(--muted);margin-top:2px}
  .tol.warnz .tv{color:var(--warn)}

  .perfgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  @media (max-width:640px){.perfgrid{grid-template-columns:1fr}}
  .perf{background:var(--surface-2);border-radius:10px;padding:14px 15px}
  .perf .pk{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;font-weight:600}
  .perf .pv{font-family:var(--mono);font-size:25px;font-weight:600;margin-top:6px;letter-spacing:-.01em}
  .perf .pv small{font-size:13px;color:var(--muted);font-weight:500}
  .perf .pb{font-size:11px;margin-top:4px;display:inline-flex;align-items:center;gap:5px;font-weight:500}
  .perf .pb .bd{width:6px;height:6px;border-radius:50%}
  .perf .pb.net{color:var(--drive)} .perf .pb.net .bd{background:var(--drive)}
  .perf .pb.drv{color:var(--warn)} .perf .pb.drv .bd{background:var(--warn)}

  .cardhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .cardtools{display:flex;gap:6px}
  .tool{font-family:var(--sans);font-size:12px;font-weight:500;padding:7px 12px;border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text);border-radius:8px;cursor:pointer;transition:.12s}
  .tool:hover{border-color:var(--accent);color:var(--accent)}
  .tool:active{transform:translateY(1px)}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);font-size:13px;font-weight:500;padding:10px 18px;border-radius:22px;opacity:0;pointer-events:none;transition:.2s;z-index:50;box-shadow:var(--shadow)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .tablewrap{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border)}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
  td.num,th.num{text-align:right;font-family:var(--mono)}
  tbody tr:last-child td{border-bottom:0}
  tr.total td{border-top:2px solid var(--border-strong);font-weight:600;background:var(--surface-2)}

  .diagram{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px 22px;box-shadow:var(--shadow)}
  .tabbar{display:inline-flex;gap:4px;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:10px;padding:3px;margin-bottom:14px}
  .tabbar button{font-family:var(--sans);font-size:12.5px;font-weight:500;padding:8px 16px;border:0;background:transparent;color:var(--muted);border-radius:7px;cursor:pointer;transition:.12s}
  .tabbar button:hover{color:var(--text)}
  .tabbar button.active{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
  .tabpane[hidden]{display:none}
  .ec-cap{font-size:12.5px;color:var(--muted);margin:2px 0 16px;line-height:1.6}
  .ec-cap b{color:var(--text);font-family:var(--mono)}
  .quorum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
  @media (max-width:640px){.quorum{grid-template-columns:1fr}}
  .qcard{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:13px 14px}
  .qcard .qk{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
  .qcard .qv{font-family:var(--mono);font-size:22px;font-weight:600;margin-top:5px}
  .qcard .qn{font-size:11px;color:var(--faint);margin-top:3px}
  .qcard.read .qv{color:var(--ok)} .qcard.write .qv{color:var(--drive)} .qcard.node .qv{color:var(--accent)}
  .diagwrap{overflow-x:auto;padding-top:6px}
  .legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:12px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

  .notes{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px}
  .notes h3{font-size:13px;margin:0 0 12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
  .notes ul{margin:0;padding-left:18px;color:var(--muted);font-size:13px}
  .notes li{margin-bottom:7px}
  .notes a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent-weak)}
  .notes a:hover{border-bottom-color:var(--accent)}
  .warnrow{display:flex;gap:9px;align-items:flex-start;background:var(--ok-weak);border:1px solid var(--ok);border-radius:10px;padding:11px 13px;font-size:12.5px;color:var(--text);margin-top:2px}
  .warnrow.hide{display:none}
  .warnrow .wi{color:var(--ok);flex:none;font-weight:700}
  .warnrow b{font-family:var(--mono)}
  .warnrow.amber{background:var(--warn-weak);border-color:var(--warn)}
  .warnrow.amber .wi{color:var(--warn)}

  footer{margin-top:30px;text-align:center;color:var(--faint);font-size:11.5px;line-height:1.7}
  .disclaimer{font-size:11px;color:var(--faint);margin-top:10px;padding-left:2px}

  @media print{
    body{background:#fff}
    aside.panel,.cardtools,.tabbar,.langtog{display:none}
    .app{grid-template-columns:1fr;gap:0}
    .headline,.metric,.card,.diagram,.notes,.warnrow{box-shadow:none;break-inside:avoid}
  }
</style>

<div class="wrap">
  <header class="top">

      <div>
        <div class="eyebrow">Hardware Sizer</div>
        <h1 data-i18n="h1">클러스터 하드웨어 사이저</h1>
      </div>
    </div>
    <div class="hgroup">
      <div class="langtog seg mini" id="langSel">
        <button data-lang="ko" class="active">KO</button>
        <button data-lang="en">EN</button>
      </div>
      <div class="sub" data-i18n="sub"></div>
    </div>
  </header>

  <div class="howto">
    <span class="step"><b>①</b> <span data-i18n="howto1"></span></span>
    <span class="arw">→</span>
    <span class="step"><b>②</b> <span data-i18n="howto2"></span></span>
    <span class="arw">→</span>
    <span class="step"><b>③</b> <span data-i18n="howto3"></span></span>
  </div>

  <div class="app">
    <aside class="panel">
      <div class="field">
        <div class="label"><span data-i18n="cap_title"></span> <span class="hint" id="modeHint"></span></div>
        <div class="presets" id="presets">
          <button data-tb="100">100TB</button>
          <button data-tb="200">200TB</button>
          <button data-tb="400">400TB</button>
          <button data-tb="1024">1PB</button>
        </div>
        <div class="custom">
          <input type="number" id="customTB" min="1" step="1" data-i18n-ph="cap_ph">
          <select id="capUnit" style="width:90px">
            <option value="1">TB</option>
            <option value="1024">PB</option>
          </select>
        </div>
        <div style="margin-top:10px">
          <div class="seg mini" id="targetMode">
            <button data-m="usable" class="active" data-i18n="seg_usable"></button>
            <button data-m="raw" data-i18n="seg_raw"></button>
          </div>
        </div>
      </div>

      <div class="field">
        <div class="label"><span data-i18n="perf_title"></span> <span class="hint" data-i18n="perf_hint"></span></div>
        <div class="custom">
          <input type="number" id="perfTarget" min="0" step="1" data-i18n-ph="perf_ph">
          <span style="align-self:center;font-family:var(--mono);font-size:12px;color:var(--muted)">GB/s</span>
        </div>
      </div>

      <div class="field">
        <div class="label"><span data-i18n="ec_title"></span> <span class="hint" id="ecHint"></span></div>
        <div class="ecfixed">EC 8:3 <span style="color:var(--faint);font-weight:400">· 63% · <span data-i18n="ec_sym"></span></span></div>
      </div>

      <div class="field">
        <div class="label"><span data-i18n="drive_title"></span> <span class="hint" id="driveHint"></span></div>
        <select id="driveSel"></select>
      </div>

      <div class="field">
        <div class="label"><span data-i18n="srv_title"></span> <span class="hint" data-i18n="srv_hint"></span></div>
        <div class="row">
          <select id="vendorSel" style="flex:0 0 38%"></select>
          <select id="modelSel" style="flex:1;min-width:0"></select>
        </div>
        <div class="seg mini" id="ffSel" style="margin-top:8px">
          <button data-ff="e3s" class="active">E3.S · NVMe</button>
          <button data-ff="lff">LFF · HDD</button>
        </div>
        <div class="custom" id="bayCustomWrap" style="display:none">
          <input type="number" id="bayCustom" min="4" max="200" step="1" data-i18n-ph="bay_ph">
        </div>
        <div class="hint" id="bayEcho" style="margin-top:7px;font-family:var(--mono);font-size:11.5px;color:var(--faint)"></div>
      </div>

      <div class="field">
        <div class="label"><span data-i18n="nic_title"></span> <span class="hint" data-i18n="nic_hint"></span></div>
        <div class="nicrow">
          <span class="niclbl" data-i18n="nic_client"></span>
          <select id="nicClientSel">
            <option value="10">10 GbE (1.25 GB/s)</option>
            <option value="25">25 GbE (3.1 GB/s)</option>
            <option value="50">50 GbE (6.25 GB/s)</option>
            <option value="100" selected>100 GbE (12.5 GB/s)</option>
            <option value="200">200 GbE (25 GB/s)</option>
            <option value="400">400 GbE (50 GB/s)</option>
          </select>
        </div>
        <div class="nicrow" style="margin-top:8px">
          <span class="niclbl" data-i18n="nic_internode"></span>
          <select id="nicInternodeSel">
            <option value="10">10 GbE (1.25 GB/s)</option>
            <option value="25">25 GbE (3.1 GB/s)</option>
            <option value="50">50 GbE (6.25 GB/s)</option>
            <option value="100" selected>100 GbE (12.5 GB/s)</option>
            <option value="200">200 GbE (25 GB/s)</option>
            <option value="400">400 GbE (50 GB/s)</option>
          </select>
        </div>
      </div>

      <div class="field">
        <div class="label"><span data-i18n="cpu_title"></span> <span class="hint" id="cpuHint"></span></div>
        <select id="cpuSel"></select>
      </div>

      <div class="field">
        <div class="label"><span data-i18n="ram_title"></span> <span class="hint" id="ramHint"></span></div>
        <select id="ramSel">
          <option value="128">128 GB</option>
          <option value="256" selected>256 GB</option>
          <option value="384">384 GB</option>
          <option value="512">512 GB</option>
          <option value="768">768 GB</option>
          <option value="1024">1024 GB (1TB)</option>
        </select>
      </div>

      <div class="field">
        <label class="chk"><input type="checkbox" id="autoChk" checked> <span data-i18n="auto_chk"></span></label>
        <div class="sliderbox on" id="sliderbox" style="margin-top:14px">
          <div class="slider-head"><span data-i18n="node_count"></span> <b id="nVal">4</b></div>
          <div class="seg mini" id="nodeSeg"></div>
          <div class="slider-head" style="margin-top:14px"><span data-i18n="drives_per"></span> <b id="dVal">4</b> <span id="dStep" style="font-weight:400;color:var(--faint);font-size:11px"></span></div>
          <input type="range" id="dRange" min="4" max="48" step="1" value="4">
        </div>
      </div>
    </aside>

    <div class="results">
      <div class="headline">
        <div>
          <div class="hl-label" data-i18n="hl_usable"></div>
          <div class="big"><span id="usableV">—</span></div>
        </div>
        <div style="text-align:center">
          <div class="hl-label" data-i18n="hl_vs"></div>
          <div class="badge ok" id="metBadge"><span class="dot"></span><span id="metText">—</span></div>
        </div>
        <div class="hl-target">
          <div class="hl-label" data-i18n="hl_target"></div>
          <div class="t"><span id="targetV">—</span></div>
          <div class="t" style="color:var(--muted)">RAW <span id="rawV">—</span></div>
        </div>
      </div>

      <div class="metrics" id="metrics"></div>

      <div class="cols">
        <div class="card">
          <h3><span class="ic">▤</span><span data-i18n="h_nodespec"></span></h3>
          <div id="nodeSpec"></div>
        </div>
        <div class="card">
          <h3><span class="ic">◆</span><span data-i18n="h_tol"></span></h3>
          <div class="tolgrid" id="tolGrid"></div>
          <div class="disclaimer" data-i18n="tol_disc"></div>
        </div>
      </div>

      <div class="card">
        <h3><span class="ic">≣</span><span data-i18n="h_net"></span></h3>
        <div class="cols" style="gap:20px">
          <div id="netClient"></div>
          <div id="netInternode"></div>
        </div>
      </div>

      <div class="card">
        <div class="cardhead">
          <h3 style="margin:0"><span class="ic">⏱</span><span data-i18n="h_perf"></span></h3>
          <div class="badge ok" id="perfBadge" style="display:none"><span class="dot"></span><span id="perfBadgeText"></span></div>
        </div>
        <div class="perfgrid" id="perfGrid"></div>
        <div class="disclaimer" data-i18n-html="perf_disc"></div>
      </div>

      <div class="card" id="bomCard">
        <div class="cardhead">
          <h3 style="margin:0"><span class="ic">▦</span><span data-i18n="h_bom"></span></h3>
          <div class="cardtools">
            <button class="tool" id="copyBom" data-i18n="btn_copy"></button>
            <button class="tool" id="printBom" data-i18n="btn_print"></button>
          </div>
        </div>
        <div class="tablewrap"><table id="bom"></table></div>
      </div>

      <div class="diagram">
        <div class="tabbar" id="diagTabs">
          <button data-tab="topo" class="active" data-i18n="tab_topo"></button>
          <button data-tab="ec" data-i18n="tab_ec"></button>
        </div>
        <div class="tabpane" id="pane-topo">
          <div class="diagwrap"><div id="diagram"></div></div>
          <div class="legend">
            <span><i style="background:var(--drive)"></i> <span data-i18n="leg_data_drv"></span></span>
            <span><i style="background:var(--drive-parity)"></i> <span data-i18n="leg_parity"></span></span>
            <span><i style="background:var(--surface-3)"></i> <span data-i18n="leg_node"></span></span>
          </div>
          <div class="disclaimer" data-i18n-html="topo_disc"></div>
        </div>
        <div class="tabpane" id="pane-ec" hidden>
          <div class="ec-cap" id="eccap"></div>
          <div class="diagwrap"><div id="ecdiagram"></div></div>
          <div class="legend">
            <span><i style="background:var(--drive)"></i> <span data-i18n="leg_data"></span></span>
            <span><i style="background:var(--drive-parity)"></i> <span data-i18n="leg_parity2"></span></span>
            <span><i style="background:var(--surface-3);border:1px solid var(--border-strong)"></i> <span data-i18n="leg_nodeb"></span></span>
          </div>
          <div class="quorum" id="ecquorum"></div>
          <div class="disclaimer" id="ecnote"></div>
        </div>
      </div>

      <div class="warnrow hide" id="warnDivis"><span class="wi">✓</span><span id="warnDivisText"></span></div>
      <div class="warnrow amber hide" id="bayLimit"><span class="wi">⚠</span><span id="bayLimitText"></span></div>
      <div class="warnrow amber hide" id="hddWarn"><span class="wi">⚠</span><span id="hddWarnText"></span></div>

      <div class="notes">
        <h3 data-i18n="notes_h"></h3>
        <ul>
          <li data-i18n-html="note1"></li>
          <li data-i18n-html="note2"></li>
          <li data-i18n-html="note3"></li>
          <li data-i18n-html="note4"></li>
          <li data-i18n-html="note5"></li>
          <li data-i18n-html="note6"></li>
          <li data-i18n-html="note7"></li>
          <li data-i18n-html="note8"></li>
          <li data-i18n-html="note9"></li>
        </ul>
      </div>

      <footer data-i18n-html="footer"></footer>
    </div>
  </div>
</div>

      {m:'ProLiant DL380 Gen12 (2U)',lff:12,e3s:36},
      {m:'ProLiant DL385 Gen11 (2U · AMD)',lff:12,e3s:24}
    ],
    '__custom__':[]
  };
  var DRIVES={ e3s:[3.84,7.68,15.36,30.72,61.44], lff:[8,12,16,20,24,30] };
  // 용량 티어별 기본 구성(APAC 경량, E3.S NVMe) — 선택 시 전체 세팅 후 사용자가 개별 조정
  var PRESETS={
    '100':{drive:15.36,nic:25,cpu:'1|16',ram:256},
    '200':{drive:15.36,nic:50,cpu:'1|32',ram:256},
    '400':{drive:15.36,nic:100,cpu:'1|32',ram:256},
    '1024':{drive:30.72,nic:100,cpu:'1|32',ram:512}
  };
  var CPU_OPTS=[{v:'1|16',s:1,c:16},{v:'1|32',s:1,c:32},{v:'1|64',s:1,c:64},{v:'2|128',s:2,c:128,x:'2×64'}];
  var OS_OPTS=[480,960,1920];
  function ffMedia(ff){ return ff==='e3s'?'NVMe':'HDD'; }
  function ffLabel(ff){ return ff==='lff'?'LFF(3.5")':'E3.S'; }
  var PERF={ e3s:{r:5.0,w:2.5,iops:250000}, lff:{r:0.25,w:0.20,iops:200} };

  var state={
    lang:'ko',
    targetTB:400, mode:'usable', ec:'8:3', drive:15.36, nicClient:100, nicInternode:100, ram:256, cpuSockets:1, cpuCores:32,
    vendor:'HPE', model:'ProLiant DL380 Gen12 (2U)', ff:'e3s', bays:36,
    perfTargetR:0, osDrive:960,
    auto:true, N:4, D:4
  };

  // ---------- helpers ----------
  function ecParams(ec){ if(ec==='8:3') return {K:8,P:3,data:5}; return {K:12,P:4,data:8}; }
  function fmtCap(tb){
    if(tb>=1000){var pb=tb/1024; return {n:(pb>=100?pb.toFixed(0):pb.toFixed(pb>=10?1:2)),u:'PB'};}
    return {n:(tb>=100?tb.toFixed(0):tb.toFixed(tb>=10?0:1)),u:'TB'};
  }
  function capStr(tb){var f=fmtCap(tb);return f.n+' '+f.u;}
  function fmtGB(gb){ return gb>=1024 ? (gb/1024).toFixed(gb%1024===0?0:1)+' TB' : gb+' GB'; }
  function osStr(gb){ return gb>=1000 ? (gb/1000)+' TB' : gb+' GB'; }
  function recCores(){ if(state.ff!=='e3s') return 16; return {10:8,25:16,50:24,100:32,200:48,400:64}[state.nicClient]||32; }
  function cpuStatus(){ var rc=recCores(); if(state.cpuCores<rc) return {t:t('cpu_low'),ok:false}; if(state.cpuCores>rc*2) return {t:t('cpu_over'),ok:false}; return {t:t('cpu_ok'),ok:true}; }

  // 노드 수: K의 약수 중 4 이상이면서 짝수만(무조건 짝수 강제)
  function validNodeCounts(K){ var out=[]; for(var n=4;n<=K;n++){ if(K%n===0 && n%2===0) out.push(n); } if(out.length===0) out.push(4); return out; }
  // 드라이브 증분 단위: K/N 배수 ∧ 짝수(=lcm(m,2)) — 노드당 드라이브 무조건 짝수 강제
  function dStep(m){ return (m%2!==0) ? m*2 : m; }
  function firstValidD(m){ var s=dStep(m); return Math.ceil(4/s)*s; }

  // 전략: 노드 수 최소 + 노드당 드라이브 밀도 최대 (가장 적은 노드에 드라이브를 채워 목표 충족)
  function recommend(rawNeededTB, K, driveTB){
    var bays=state.bays, pd=PERF[state.ff]||PERF.e3s, nic=NIC_GBPS[state.nicClient]||0;
    var needCap=Math.ceil(rawNeededTB/driveTB), needPerf=0, minN=4;
    if(state.perfTargetR>0){ needPerf=Math.ceil(state.perfTargetR/pd.r); if(nic>0) minN=Math.max(4,Math.ceil(state.perfTargetR/nic)); }
    // 1PB(Usable) 이상은 8노드를 기본 전제로 (자동 추천 노드 하한)
    var usableTarget = state.mode==='usable' ? state.targetTB : state.targetTB*(ecParams(state.ec).data/K);
    if(usableTarget>=1024) minN=Math.max(minN,8);
    var need=Math.max(needCap,needPerf);
    var vs=validNodeCounts(K); // 오름차순
    // 오름차순 N 중, 베이 한도 내에서 목표를 채울 수 있는 최소 N을 고르고 D는 필요한 최소(짝수/스텝) — 밀도 최대
    function solve(nodeOk){
      for(var i=0;i<vs.length;i++){
        var N=vs[i]; if(!nodeOk(N)) continue;
        var m=K/N, st=dStep(m), maxD=Math.floor(bays/st)*st, fd=firstValidD(m);
        if(maxD<fd) continue;
        if(N*maxD<need) continue;              // 이 노드 수로는 베이 안에서 목표 미달
        var D=fd; while(N*D<need) D+=st;        // 목표 충족 최소 드라이브(밀도 최대)
        return {N:N,D:D,total:N*D};
      }
      return null;
    }
    var best=solve(function(N){return N>=minN;});   // 네트워크 노드 하한 우선
    if(!best) best=solve(function(){return true;}); // 네트워크 도달 불가 → 하한 무시(성능 카드가 병목 표시)
    if(!best){                                       // 베이 한도로 용량 미달 → 최대 용량(최다 노드×풀 베이)
      var N2=vs[vs.length-1], m2=K/N2, st2=dStep(m2), D2=Math.floor(bays/st2)*st2, fd2=firstValidD(m2);
      if(D2<fd2)D2=fd2; best={N:N2,D:D2,total:N2*D2};
    }
    return best;
  }
  function snapSymmetric(K){
    var vs=validNodeCounts(K);
    if(vs.indexOf(state.N)<0){ var nearest=vs[0], b=Infinity; vs.forEach(function(n){var d=Math.abs(n-state.N); if(d<b){b=d;nearest=n;}}); state.N=nearest; }
    var m=K/state.N, s=dStep(m), fd=firstValidD(m);
    var D=Math.round(state.D/s)*s; if(D<fd)D=fd; if(D>state.bays)D=Math.floor(state.bays/s)*s; if(D<fd)D=fd;
    state.D=D;
  }

  function compute(){
    var ep=ecParams(state.ec), eff=ep.data/ep.K;
    var rawNeeded = state.mode==='usable' ? state.targetTB/eff : state.targetTB;
    if(state.auto){ var r=recommend(rawNeeded,ep.K,state.drive); state.N=r.N; state.D=r.D; } else { snapSymmetric(ep.K); }
    var N=state.N, D=state.D, total=N*D, rawTB=total*state.drive, usableTB=rawTB*eff;
    var m=ep.K/N, sets=total/ep.K, shardsPerNode=Math.ceil(ep.K/N);
    var nodeTol=Math.floor(ep.P/shardsPerNode); if(nodeTol<0)nodeTol=0;
    var writeTol=Math.max(0,ep.P-1);
    var pd=PERF[state.ff]||PERF.e3s, nic=NIC_GBPS[state.nicClient]||0;
    var netCeil=N*nic, driveRead=total*pd.r, driveWriteEff=total*pd.w*eff;
    var readTP=Math.min(netCeil,driveRead), writeTP=Math.min(netCeil,driveWriteEff);
    var readBn=netCeil<=driveRead?'net':'drv', writeBn=netCeil<=driveWriteEff?'net':'drv';
    var iops=total*pd.iops;
    return {ep:ep,eff:eff,N:N,D:D,total:total,rawTB:rawTB,m:m,usableTB:usableTB,sets:sets,shardsPerNode:shardsPerNode,
            driveTol:ep.P,writeTol:writeTol,nodeTol:nodeTol,readTP:readTP,writeTP:writeTP,readBn:readBn,writeBn:writeBn,iops:iops};
  }

  // ---------- topology diagram ----------
  function drawDiagram(c){
    var N=c.N, D=c.D;
    var perRow=Math.min(N, N<=4?N:(N<=6?N:(N<=8?4:5))), rows=Math.ceil(N/perRow);
    var dCols=Math.min(D,8), shownDrives=Math.min(D,16), dRows=Math.ceil(shownDrives/dCols);
    var cell=15, cgap=3, pad=12, headH=42;
    var nodeW=pad*2 + dCols*cell + (dCols-1)*cgap; if(nodeW<150)nodeW=150;
    var innerW=dCols*cell+(dCols-1)*cgap, driveAreaX=pad+(nodeW-pad*2-innerW)/2;
    var nodeH=headH + dRows*cell + (dRows-1)*cgap + pad + 12;
    var ngap=18, marginX=16, lbH=40, netH=30, gapV=26;
    var gridW=perRow*nodeW+(perRow-1)*ngap, W=Math.max(gridW+marginX*2,520);
    var nodesTop=lbH+gapV+30, nodesBlockH=rows*nodeH+(rows-1)*ngap, H=nodesTop+nodesBlockH+gapV+netH+10;
    var s='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" xmlns="http://www.w3.org/2000/svg" font-family="var(--sans)">';
    s+='<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="var(--faint)"/></marker></defs>';
    var lbW=Math.min(gridW,360), lbX=(W-lbW)/2;
    s+='<rect x="'+lbX+'" y="6" width="'+lbW+'" height="'+lbH+'" rx="9" fill="var(--accent-weak)" stroke="var(--accent)" stroke-width="1.2"/>';
    s+='<text x="'+(W/2)+'" y="'+(6+lbH/2-2)+'" text-anchor="middle" font-size="13" font-weight="600" fill="var(--accent)">'+t('dg_lb')+'</text>';
    s+='<text x="'+(W/2)+'" y="'+(6+lbH/2+13)+'" text-anchor="middle" font-size="10.5" fill="var(--muted)">'+t('dg_lb_sub')+'</text>';
    s+='<line x1="'+(W/2)+'" y1="'+(6+lbH)+'" x2="'+(W/2)+'" y2="'+(nodesTop-8)+'" stroke="var(--faint)" stroke-width="1.4" marker-end="url(#ah)"/>';
    for(var i=0;i<N;i++){
      var r=Math.floor(i/perRow), col=i%perRow;
      var rowCount=(r===rows-1)?(N-perRow*r):perRow, rowW=rowCount*nodeW+(rowCount-1)*ngap, rowX=(W-rowW)/2;
      var nx=rowX+col*(nodeW+ngap), ny=nodesTop+r*(nodeH+ngap);
      s+='<rect x="'+nx+'" y="'+ny+'" width="'+nodeW+'" height="'+nodeH+'" rx="10" fill="var(--surface-3)" stroke="var(--border-strong)" stroke-width="1"/>';
      s+='<text x="'+(nx+pad)+'" y="'+(ny+20)+'" font-size="12.5" font-weight="700" fill="var(--text)">Node '+(i+1)+'</text>';
      s+='<text x="'+(nx+pad)+'" y="'+(ny+34)+'" font-size="9.5" fill="var(--muted)">'+state.cpuCores+'c · '+state.ram+'GB · '+state.nicClient+'GbE</text>';
      var parityShown=Math.round(shownDrives*c.ep.P/c.ep.K);
      for(var d=0;d<shownDrives;d++){
        var drr=Math.floor(d/dCols), dc=d%dCols, dx=nx+driveAreaX+dc*(cell+cgap), dy=ny+headH+drr*(cell+cgap);
        var isParity = d >= (shownDrives - parityShown), fill = isParity? 'var(--drive-parity)':'var(--drive)';
        s+='<rect x="'+dx+'" y="'+dy+'" width="'+cell+'" height="'+cell+'" rx="2.5" fill="'+fill+'" opacity="0.9"/>';
      }
      if(D>shownDrives) s+='<text x="'+(nx+nodeW-pad)+'" y="'+(ny+nodeH-8)+'" text-anchor="end" font-size="9.5" fill="var(--muted)">+'+(D-shownDrives)+' more</text>';
    }
    var netY=nodesTop+nodesBlockH+gapV, netW=Math.min(gridW,520), netX=(W-netW)/2;
    s+='<rect x="'+netX+'" y="'+netY+'" width="'+netW+'" height="'+netH+'" rx="8" fill="var(--surface-2)" stroke="var(--border-strong)" stroke-dasharray="4 3"/>';
    s+='<text x="'+(W/2)+'" y="'+(netY+netH/2+4)+'" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--muted)">'+t('dg_internode',{nic:state.nicInternode})+'</text>';
    s+='</svg>';
    document.getElementById('diagram').innerHTML=s;
  }

  // ---------- EC diagram ----------
  function drawEC(c){
    var K=c.ep.K, data=c.ep.data, P=c.ep.P, N=c.N, spn=c.shardsPerNode;
    document.getElementById('eccap').innerHTML=t('ec_cap',{k:K,data:data,p:P,n:N,spn:spn,sets:(c.sets||'—')});
    var sq=30, gap=8, pad=18, rowW=K*sq+(K-1)*gap, objW=64, arrowW=44, aStartX=pad, objY=54, rowX=aStartX+objW+arrowW;
    var W=Math.max(rowX+rowW+pad,560);
    var colGap=14, maxPerNode=spn, colW=sq+16, distRowW=N*colW+(N-1)*colGap;
    W=Math.max(W,pad*2+distRowW);
    var secBY=objY+sq+70, colTop=secBY+58, colBodyH=maxPerNode*(sq+gap)+8, H=colTop+colBodyH+24;
    var s='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" xmlns="http://www.w3.org/2000/svg" font-family="var(--sans)">';
    s+='<defs><marker id="ah2" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="var(--faint)"/></marker></defs>';
    s+='<text x="'+pad+'" y="26" font-size="12" font-weight="700" fill="var(--text)">'+t('ec_secA',{k:K})+'</text>';
    s+='<rect x="'+aStartX+'" y="'+objY+'" width="'+objW+'" height="'+sq+'" rx="6" fill="var(--surface-3)" stroke="var(--border-strong)"/>';
    s+='<text x="'+(aStartX+objW/2)+'" y="'+(objY+sq/2+4)+'" text-anchor="middle" font-size="11" font-weight="600" fill="var(--text)">'+t('ec_obj')+'</text>';
    s+='<line x1="'+(aStartX+objW+8)+'" y1="'+(objY+sq/2)+'" x2="'+(rowX-6)+'" y2="'+(objY+sq/2)+'" stroke="var(--faint)" stroke-width="1.6" marker-end="url(#ah2)"/>';
    s+='<text x="'+(aStartX+objW+arrowW/2)+'" y="'+(objY-6)+'" text-anchor="middle" font-size="9.5" fill="var(--muted)">split+encode</text>';
    for(var i=0;i<K;i++){
      var isP=i>=data, x=rowX+i*(sq+gap);
      s+='<rect x="'+x+'" y="'+objY+'" width="'+sq+'" height="'+sq+'" rx="5" fill="'+(isP?'var(--drive-parity)':'var(--drive)')+'" opacity="0.92"/>';
      s+='<text x="'+(x+sq/2)+'" y="'+(objY+sq/2+4)+'" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">'+(isP?'P'+(i-data+1):'D'+(i+1))+'</text>';
    }
    var dEndX=rowX+data*sq+(data-1)*gap;
    s+='<line x1="'+rowX+'" y1="'+(objY+sq+9)+'" x2="'+dEndX+'" y2="'+(objY+sq+9)+'" stroke="var(--drive)" stroke-width="1.4"/>';
    s+='<text x="'+((rowX+dEndX)/2)+'" y="'+(objY+sq+23)+'" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--drive)">'+t('ec_data',{data:data})+'</text>';
    var pStartX=rowX+data*(sq+gap), pEndX=rowX+rowW;
    s+='<line x1="'+pStartX+'" y1="'+(objY+sq+9)+'" x2="'+pEndX+'" y2="'+(objY+sq+9)+'" stroke="var(--drive-parity)" stroke-width="1.4"/>';
    s+='<text x="'+((pStartX+pEndX)/2)+'" y="'+(objY+sq+23)+'" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--drive-parity)">'+t('ec_parity',{p:P})+'</text>';
    s+='<text x="'+pad+'" y="'+(secBY+18)+'" font-size="12" font-weight="700" fill="var(--text)">'+t('ec_secB',{k:K,n:N,spn:spn})+'</text>';
    var distX=(W-distRowW)/2; if(distX<pad)distX=pad;
    for(var n2=0;n2<N;n2++){
      var cx=distX+n2*(colW+colGap);
      s+='<rect x="'+cx+'" y="'+colTop+'" width="'+colW+'" height="'+colBodyH+'" rx="8" fill="var(--surface-2)" stroke="var(--border-strong)"/>';
      s+='<text x="'+(cx+colW/2)+'" y="'+(colTop-8)+'" text-anchor="middle" font-size="10" font-weight="600" fill="var(--muted)">Node '+(n2+1)+'</text>';
    }
    var slot=[]; for(var n3=0;n3<N;n3++)slot.push(0);
    for(var kk=0;kk<K;kk++){
      var node=kk%N, cx2=distX+node*(colW+colGap), sy=colTop+4+slot[node]*(sq+gap), isP2=kk>=data;
      s+='<rect x="'+(cx2+(colW-sq)/2)+'" y="'+sy+'" width="'+sq+'" height="'+sq+'" rx="5" fill="'+(isP2?'var(--drive-parity)':'var(--drive)')+'" opacity="0.92"/>';
      s+='<text x="'+(cx2+colW/2)+'" y="'+(sy+sq/2+4)+'" text-anchor="middle" font-size="9.5" font-weight="600" fill="#fff">'+(isP2?'P'+(kk-data+1):'D'+(kk+1))+'</text>';
      slot[node]++;
    }
    s+='</svg>';
    document.getElementById('ecdiagram').innerHTML=s;
    document.getElementById('ecquorum').innerHTML=
      '<div class="qcard read"><div class="qk">'+t('q_read')+'</div><div class="qv">'+data+' <span style="font-size:13px;color:var(--muted)">'+t('q_need')+'</span></div><div class="qn">'+t('q_read_n',{p:P})+'</div></div>'+
      '<div class="qcard write"><div class="qk">'+t('q_write')+'</div><div class="qv">'+(data+1)+' <span style="font-size:13px;color:var(--muted)">'+t('q_need')+'</span></div><div class="qn">'+t('q_write_n',{w:c.writeTol})+'</div></div>'+
      '<div class="qcard node"><div class="qk">'+t('q_node')+'</div><div class="qv">'+c.nodeTol+' <span style="font-size:13px;color:var(--muted)">'+t('q_node_unit')+'</span></div><div class="qn">'+t('q_node_n',{spn:spn})+'</div></div>';
    document.getElementById('ecnote').textContent=t('ec_note',{ec:state.ec,data:data,p:P,eff:Math.round(c.eff*100)});
  }

  // ---------- static i18n + option builders ----------
  function buildCpuOptions(){
    document.getElementById('cpuSel').innerHTML=CPU_OPTS.map(function(o){
      var lab=t('cpu_opt',{s:o.s,c:o.c})+(o.x?' ('+o.x+')':'');
      return '<option value="'+o.v+'"'+(o.v===(state.cpuSockets+'|'+state.cpuCores)?' selected':'')+'>'+lab+'</option>';
    }).join('');
  }
  function applyStatic(){
    document.title=t('doc_title');
    document.querySelectorAll('[data-i18n]').forEach(function(el){ el.textContent=t(el.getAttribute('data-i18n')); });
    document.querySelectorAll('[data-i18n-html]').forEach(function(el){ el.innerHTML=t(el.getAttribute('data-i18n-html')); });
    document.querySelectorAll('[data-i18n-ph]').forEach(function(el){ el.setAttribute('placeholder',t(el.getAttribute('data-i18n-ph'))); });
    buildCpuOptions();
  }

  // ---------- events ----------
  function setActive(container,attr,val){ container.querySelectorAll('button').forEach(function(b){ b.classList.toggle('active', b.getAttribute(attr)===String(val)); }); }

  document.getElementById('langSel').addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b)return;
    state.lang=b.getAttribute('data-lang');
    setActive(this,'data-lang',state.lang);
    applyStatic(); populateVendors(); populateModels(); populateDrives(); render();
  });

  var presets=document.getElementById('presets');
  presets.addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b)return;
    applyPreset(parseFloat(b.getAttribute('data-tb')));
    setActive(presets,'data-tb',state.targetTB); render();
  });
  document.getElementById('customTB').addEventListener('input',function(){
    var v=parseFloat(this.value); if(isNaN(v)||v<=0)return;
    state.targetTB=v*parseFloat(document.getElementById('capUnit').value);
    presets.querySelectorAll('button').forEach(function(b){b.classList.remove('active');}); render();
  });
  document.getElementById('capUnit').addEventListener('change',function(){
    var v=parseFloat(document.getElementById('customTB').value);
    if(!isNaN(v)&&v>0){state.targetTB=v*parseFloat(this.value);render();}
  });
  document.getElementById('targetMode').addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b)return;
    state.mode=b.getAttribute('data-m'); setActive(this,'data-m',state.mode); render();
  });
  document.getElementById('driveSel').addEventListener('change',function(){state.drive=parseFloat(this.value);render();});
  document.getElementById('nicClientSel').addEventListener('change',function(){state.nicClient=parseInt(this.value);render();});
  document.getElementById('nicInternodeSel').addEventListener('change',function(){state.nicInternode=parseInt(this.value);render();});
  document.getElementById('ramSel').addEventListener('change',function(){state.ram=parseInt(this.value);render();});
  document.getElementById('cpuSel').addEventListener('change',function(){var p=this.value.split('|');state.cpuSockets=parseInt(p[0]);state.cpuCores=parseInt(p[1]);render();});
  document.getElementById('perfTarget').addEventListener('input',function(){var v=parseFloat(this.value);state.perfTargetR=(!isNaN(v)&&v>0)?v:0;render();});

  var vendorSel=document.getElementById('vendorSel'), modelSel=document.getElementById('modelSel'), ffSel=document.getElementById('ffSel'), bayCustomWrap=document.getElementById('bayCustomWrap');
  function currentModel(){ var l=SERVERS[state.vendor]||[]; for(var i=0;i<l.length;i++) if(l[i].m===state.model) return l[i]; return null; }
  function applyBays(){ if(state.vendor==='__custom__'){ var v=parseInt(document.getElementById('bayCustom').value); if(v>=4)state.bays=v; return; } var cm=currentModel(); if(cm) state.bays=cm[state.ff]||cm.e3s; }
  function populateDrives(){
    var list=DRIVES[state.ff]||DRIVES.e3s;
    if(list.indexOf(state.drive)<0) state.drive=list[Math.min(2,list.length-1)];
    var media=ffMedia(state.ff);
    document.getElementById('driveSel').innerHTML=list.map(function(x){ return '<option value="'+x+'"'+(x===state.drive?' selected':'')+'>'+x+' TB '+media+'</option>'; }).join('');
    document.getElementById('driveHint').textContent=(media==='NVMe'?t('drive_hint_nvme'):t('drive_hint_hdd'));
  }
  function applyPreset(tb){
    var p=PRESETS[String(tb)]; state.targetTB=tb;
    if(!p) return;
    state.ff='e3s'; state.drive=p.drive;
    state.nicClient=p.nic; state.nicInternode=p.nic;
    var cp=p.cpu.split('|'); state.cpuSockets=parseInt(cp[0]); state.cpuCores=parseInt(cp[1]);
    state.ram=p.ram; state.auto=true; state.perfTargetR=0;
    document.getElementById('customTB').value=''; document.getElementById('perfTarget').value='';
    setActive(ffSel,'data-ff','e3s'); populateDrives();
    document.getElementById('nicClientSel').value=String(p.nic);
    document.getElementById('nicInternodeSel').value=String(p.nic);
    document.getElementById('cpuSel').value=p.cpu;
    document.getElementById('ramSel').value=String(p.ram);
    document.getElementById('autoChk').checked=true; sliderbox.classList.remove('on');
  }
  function vendorLabel(v){ return v==='__custom__'? t('vendor_custom') : v; }
  function populateVendors(){
    vendorSel.innerHTML=Object.keys(SERVERS).map(function(v){ return '<option value="'+v+'"'+(v===state.vendor?' selected':'')+'>'+vendorLabel(v)+'</option>'; }).join('');
  }
  function populateModels(){
    var list=SERVERS[state.vendor]||[];
    if(state.vendor==='__custom__'){
      modelSel.innerHTML='<option>'+t('model_custom')+'</option>';
      modelSel.disabled=true; ffSel.style.display='none'; bayCustomWrap.style.display='flex'; applyBays();
    } else {
      modelSel.disabled=false; ffSel.style.display='flex'; bayCustomWrap.style.display='none';
      if(!list.some(function(s){return s.m===state.model;})) state.model=list[0].m;
      modelSel.innerHTML=list.map(function(s){ return '<option value="'+s.m+'"'+(s.m===state.model?' selected':'')+'>'+s.m+' · E3.S '+s.e3s+' / LFF '+s.lff+'</option>'; }).join('');
      modelSel.value=state.model; applyBays();
    }
  }
  vendorSel.addEventListener('change',function(){
    state.vendor=this.value; var list=SERVERS[state.vendor]||[];
    if(state.vendor!=='__custom__' && list.length) state.model=list[0].m;
    populateModels(); render();
  });
  modelSel.addEventListener('change',function(){ state.model=this.value; applyBays(); render(); });
  ffSel.addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b)return; state.ff=b.getAttribute('data-ff'); setActive(this,'data-ff',state.ff); populateDrives(); applyBays(); render(); });
  document.getElementById('bayCustom').addEventListener('input',function(){ var v=parseInt(this.value); if(v>=4){state.bays=v;render();} });

  var sliderbox=document.getElementById('sliderbox');
  document.getElementById('autoChk').addEventListener('change',function(){ state.auto=this.checked; sliderbox.classList.toggle('on',!state.auto); render(); });
  sliderbox.classList.remove('on');
  document.getElementById('nodeSeg').addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b||state.auto)return;
    state.N=parseInt(b.getAttribute('data-n'));
    var m=ecParams(state.ec).K/state.N; if(state.D%m!==0) state.D=Math.round(state.D/m)*m; render();
  });
  document.getElementById('dRange').addEventListener('input',function(){
    if(state.auto)return; var m=ecParams(state.ec).K/state.N;
    var v=Math.round(parseInt(this.value)/m)*m; if(v<firstValidD(m))v=firstValidD(m);
    state.D=v; document.getElementById('dVal').textContent=v; render();
  });

  var toastEl=document.getElementById('toast'), toastT;
  function toast(msg){ toastEl.textContent=msg; toastEl.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(function(){toastEl.classList.remove('show');},1800); }
  function bomCSV(){
    var rows=[]; document.getElementById('bom').querySelectorAll('tr').forEach(function(tr){
      var cells=[]; tr.querySelectorAll('th,td').forEach(function(c){ var x=(c.textContent||'').trim().replace(/\s+/g,' '); if(/[",\n]/.test(x)) x='"'+x.replace(/"/g,'""')+'"'; cells.push(x); });
      if(cells.length) rows.push(cells.join(','));
    });
    return rows.join('\r\n');
  }
  document.getElementById('copyBom').addEventListener('click',function(){
    var csv=bomCSV();
    function fb(){ var ta=document.createElement('textarea'); ta.value=csv; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.focus(); ta.select(); try{document.execCommand('copy');toast(t('toast_copied'));}catch(e){toast(t('toast_copyfail'));} document.body.removeChild(ta); }
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(csv).then(function(){toast(t('toast_copied'));},fb); } else fb();
  });
  document.getElementById('printBom').addEventListener('click',function(){
    var w=null; try{ w=window.open('','_blank'); }catch(e){}
    if(!w){ try{ window.print(); }catch(e2){} toast(t('print_hint')); return; }
    var css=''; document.querySelectorAll('style').forEach(function(s){ css+=s.textContent; });
    var logo=document.querySelector('.aistor-logo').outerHTML;
    var results=document.querySelector('.results').innerHTML;
    var doc='<!doctype html><html lang="'+state.lang+'" data-theme="light"><head><meta charset="utf-8"><title>'+t('doc_title')+'</title>'+
      '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">'+
      '<style>'+css+' body{background:#fff} .prthead{display:flex;align-items:center;gap:12px;margin-bottom:18px} .prthead h1{font-size:20px;margin:0} .cardtools,.tabbar{display:none!important}</style></head>'+
      '<body><div class="wrap"><div class="prthead">'+logo+'<h1>'+t('h1')+'</h1></div><div class="results">'+results+'</div></div>'+
      '<scr'+'ipt>window.onload=function(){setTimeout(function(){window.focus();window.print();},450);};<\/scr'+'ipt></body></html>';
    w.document.open(); w.document.write(doc); w.document.close();
  });

  document.getElementById('diagTabs').addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b)return;
    var tab=b.getAttribute('data-tab');
    this.querySelectorAll('button').forEach(function(x){x.classList.toggle('active',x===b);});
    document.getElementById('pane-topo').hidden=(tab!=='topo');
    document.getElementById('pane-ec').hidden=(tab!=='ec');
  });

  // init
  setActive(presets,'data-tb',400);
  applyStatic();
  populateVendors(); populateModels(); populateDrives();
  render();
})();
</script>
